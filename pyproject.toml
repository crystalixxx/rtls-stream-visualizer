[project]
name = "rtls-stream-visualizer"
version = "0.1.0"
description = ""
authors = [
    {name = "Maxim Drugov"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "psycopg[binary] (>=3.2.10,<4.0.0)",
    "typer (>=0.21.1,<0.22.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "yoyo-migrations (>=9.0.0,<10.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "aio-pika (>=9.6.2,<10.0.0) ; python_version >= \"3.12\" and python_version < \"4\""
]

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.poetry]
packages = [
    { include = "backend" },
    { include = "core" },
    { include = "stream_generator" },
    { include = "stream_handler" },
    { include = "udp_receiver" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
